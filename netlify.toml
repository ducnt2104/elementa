# ==============================================================================
# ELEMENTA Tactical Chemistry — Netlify Configuration
# ==============================================================================

[build]
  publish = "dist"
  command = "npm run build"

# SPA Fallback: Direct all non-file routes to index.html with HTTP 200
[[redirects]]
  from = "/*"
  to = "/index.html"
  status = 200

# Immutable caching headers for hashed production bundles
[[headers]]
  for = "/assets/*"
  [headers.values]
    Cache-Control = "public, max-age=31536000, immutable"

# Security headers
[[headers]]
  for = "/*"
  [headers.values]
    X-Frame-Options = "SAMEORIGIN"
    X-Content-Type-Options = "nosniff"
    Referrer-Policy = "strict-origin-when-cross-origin"
