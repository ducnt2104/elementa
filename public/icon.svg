<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 100 100">
  <defs>
    <linearGradient id="crystalGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#57C8C8" />
      <stop offset="50%" stop-color="#C67A45" />
      <stop offset="100%" stop-color="#F06A55" />
    </linearGradient>
    <linearGradient id="bgGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#172231" />
      <stop offset="100%" stop-color="#10131B" />
    </linearGradient>
  </defs>
  <rect width="100" height="100" rx="20" fill="url(#bgGrad)" stroke="#57C8C8" stroke-width="2" />
  <!-- Atomic orbit 1 -->
  <ellipse cx="50" cy="50" rx="38" ry="14" fill="none" stroke="#57C8C8" stroke-width="1.5" stroke-dasharray="3,3" transform="rotate(30 50 50)" opacity="0.6" />
  <!-- Atomic orbit 2 -->
  <ellipse cx="50" cy="50" rx="38" ry="14" fill="none" stroke="#C67A45" stroke-width="1.5" stroke-dasharray="3,3" transform="rotate(-30 50 50)" opacity="0.6" />
  <!-- Central Crystal Hexagon -->
  <polygon points="50,22 74,36 74,64 50,78 26,64 26,36" fill="none" stroke="url(#crystalGrad)" stroke-width="2.5" />
  <polygon points="50,30 67,40 67,60 50,70 33,60 33,40" fill="#172231" stroke="#57C8C8" stroke-width="1" opacity="0.8" />
  <!-- Elemental Core Symbol E -->
  <text x="50" y="58" font-family="'Cinzel', serif" font-size="24" font-weight="900" fill="#E8E0D1" text-anchor="middle">E</text>
  <!-- Quantum nodes -->
  <circle cx="50" cy="22" r="3" fill="#57C8C8" />
  <circle cx="74" cy="64" r="3" fill="#F06A55" />
  <circle cx="26" cy="64" r="3" fill="#C67A45" />
</svg>
